services:
  claude-video-mcp:
    build:
      context: ..
      dockerfile: remote-mcp/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp/claude-video:size=2g,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    cpus: 2

